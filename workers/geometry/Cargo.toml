[workspace]
resolver = "2"
members = ["crates/nest-import", "crates/nest-preprocess", "crates/nest-export", "crates/nest-report", "crates/nest-geometry-wasm"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libm = "0.2"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# PAS de panic = "abort" ici : wasm32-unknown-unknown l'impose déjà par
# défaut, et l'expliciter casse `cargo test --release` natif (les tests
# d'intégration lient le rlib release abort avec un harnais unwind).
