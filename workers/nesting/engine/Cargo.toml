[workspace]
resolver = "2"
members = ["crates/sparrow", "crates/nest-engine"]

[workspace.dependencies]
jagua-rs = { version = "0.7.2" }
rand = "0.10"
rand_distr = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
