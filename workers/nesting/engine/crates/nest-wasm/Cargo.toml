[package]
name = "nest-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "wasm-bindgen wrapper around nest-engine (in-browser nesting, Phase 2)"

[lib]
crate-type = ["cdylib"]

[dependencies]
nest-engine = { path = "../nest-engine" }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
console_error_panic_hook = "0.1"
